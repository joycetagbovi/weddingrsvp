<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're Invited</title>
    <meta
      name="description"
      content="Join us to celebrate our wedding. View the details, get directions, and RSVP."
    />
    <meta name="theme-color" content="#6b1d2a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <a class="skip-link" href="#rsvp">Skip to RSVP</a>

    <!-- Hidden target so the RSVP form can POST to Google Forms without navigating away -->
    <iframe name="hidden_iframe" title="RSVP submission" aria-hidden="true" tabindex="-1"></iframe>

    <main id="app">
      <!-- Hero -->
      <header class="hero" id="hero">
        <div class="hero__botanical" aria-hidden="true">
          <svg viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice">
            <g class="botanical-strokes">
              <path d="M200 560 C200 420 90 400 90 280 C90 180 150 140 200 220 C250 140 310 180 310 280 C310 400 200 420 200 560 Z" />
              <path d="M200 220 C200 160 150 110 200 60 C250 110 200 160 200 220 Z" />
              <path d="M120 320 C70 330 40 380 30 450" />
              <path d="M280 320 C330 330 360 380 370 450" />
              <path d="M110 250 C60 240 35 200 40 150" />
              <path d="M290 250 C340 240 365 200 360 150" />
              <path d="M200 400 C170 380 150 340 160 300" />
              <path d="M200 400 C230 380 250 340 240 300" />
            </g>
          </svg>
        </div>
        <div class="hero__content reveal">
          <span class="monogram" aria-hidden="true" data-monogram>J&nbsp;&middot;&nbsp;S</span>
          <p class="hero__tagline" data-tagline></p>
          <h1 class="hero__names" data-couple>Joshua &amp; Seraphina</h1>
          <span class="ornament" aria-hidden="true">
            <span class="ornament__line"></span>
            <svg class="ornament__leaf" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2 C7 7 7 15 12 22 C17 15 17 7 12 2 Z" fill="none" stroke="currentColor" stroke-width="1.2" />
              <path d="M12 5 L12 20" fill="none" stroke="currentColor" stroke-width="0.8" />
            </svg>
            <span class="ornament__line"></span>
          </span>
          <p class="hero__date" data-hero-date></p>
          <div class="hero__actions">
            <a class="btn btn--primary hero__cta" href="#rsvp">RSVP</a>
            <a class="btn btn--ghost" href="#details">View Details</a>
          </div>
        </div>
        <a class="hero__scroll" href="#details" aria-label="Scroll to details">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 9 L12 15 L18 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>
      </header>

      <!-- Announcement -->
      <section
        class="section announcement"
        id="announcement"
        aria-labelledby="announcement-title"
        data-announcement
        hidden
      >
        <div class="announcement__inner reveal">
          <p class="section__label" data-announcement-label></p>
          <h2 class="section__title" id="announcement-title" data-announcement-title>A Little Change of Plans</h2>
          <div class="announcement__body" data-announcement-body></div>
        </div>
      </section>

      <!-- Details -->
      <section class="section details" id="details" aria-labelledby="details-title">
        <div class="section__head reveal">
          <p class="section__label">The Celebration</p>
          <h2 class="section__title" id="details-title">When &amp; Where</h2>
        </div>
        <dl class="details__grid reveal">
          <div class="details__item">
            <span class="details__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3 9 H21 M8 2.5 V6 M16 2.5 V6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </span>
            <dt>Date</dt>
            <dd data-date></dd>
          </div>
          <div class="details__item">
            <span class="details__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M12 7 V12 L15.5 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <dt>Time</dt>
            <dd data-time></dd>
          </div>
          <div class="details__item">
            <span class="details__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 21 V9 L12 3 L20 9 V21 Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M9.5 21 V14 H14.5 V21" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            </span>
            <dt>Venue</dt>
            <dd data-venue-name></dd>
          </div>
          <div class="details__item">
            <span class="details__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 21 C12 21 5 14.5 5 9.5 A7 7 0 0 1 19 9.5 C19 14.5 12 21 12 21 Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="12" cy="9.5" r="2.4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
            </span>
            <dt>Address</dt>
            <dd data-venue-address></dd>
          </div>
        </dl>
      </section>

      <!-- Location -->
      <section class="section location" id="location" aria-labelledby="location-title">
        <div class="section__head reveal">
          <p class="section__label">Getting There</p>
          <h2 class="section__title" id="location-title">Venue &amp; Directions</h2>
        </div>
        <div class="location__card reveal">
          <span class="location__pin" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 22 C12 22 5 14.5 5 9.5 A7 7 0 0 1 19 9.5 C19 14.5 12 22 12 22 Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="12" cy="9.5" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          </span>
          <p class="location__venue" data-venue-name></p>
          <p class="location__address" data-venue-address></p>
          <a
            class="btn btn--primary btn--lg location__cta"
            data-directions
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 L21 3 L13 21 L11 13 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            Get Directions
          </a>
        </div>
      </section>

      <!-- RSVP -->
      <section class="section rsvp" id="rsvp" aria-labelledby="rsvp-title">
        <div class="section__head reveal">
          <p class="section__label">Kindly Reply</p>
          <h2 class="section__title" id="rsvp-title">RSVP</h2>
          <p class="rsvp__intro" data-rsvp-intro hidden></p>
        </div>

        <div class="rsvp__card reveal">
          <form class="rsvp__form" id="rsvp-form" target="hidden_iframe" novalidate>
            <fieldset class="rsvp__field">
              <legend>Will you attend?</legend>
              <div class="rsvp__choices">
                <label class="choice">
                  <input type="radio" class="js-attendance" value="yes" required />
                  <span class="choice__check" aria-hidden="true"></span>
                  <span class="choice__label" data-attendance-yes>Joyfully Accept</span>
                </label>
                <label class="choice">
                  <input type="radio" class="js-attendance" value="no" />
                  <span class="choice__check" aria-hidden="true"></span>
                  <span class="choice__label" data-attendance-no>Regretfully Decline</span>
                </label>
              </div>
            </fieldset>

            <div class="rsvp__field">
              <label for="guest-name">Your name</label>
              <input type="text" id="guest-name" class="js-name" autocomplete="name" required />
            </div>

            <div class="rsvp__field" data-guest-count-field>
              <label for="guest-count">Guests</label>
              <input type="number" id="guest-count" class="js-guest-count" min="1" step="1" inputmode="numeric" />
            </div>

            <p class="rsvp__error" data-error role="alert" hidden></p>

            <button type="submit" class="btn btn--primary btn--lg rsvp__submit">Send RSVP</button>
          </form>

          <output class="rsvp__confirmation" data-confirmation hidden>
            <span class="rsvp__confirmation-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M7 12.5 L10.5 16 L17 8.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span class="rsvp__confirmation-title">Thank you!</span>
            <span class="rsvp__confirmation-text" data-confirmation-text></span>
          </output>

          <div class="rsvp__whatsapp" data-whatsapp-wrap hidden>
            <span class="rsvp__whatsapp-or"><span>or</span></span>
            <a class="btn btn--whatsapp btn--lg" data-whatsapp target="_blank" rel="noopener noreferrer">
              <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 A9 9 0 0 0 4 16 L3 21 L8.2 20 A9 9 0 1 0 12 3 Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8.5 9 C8.5 13 11 15.5 15 15.5 C15.8 15.5 16 14.5 15.4 14 L14 13 L12.8 13.8 C11.8 13.3 10.7 12.2 10.2 11.2 L11 10 L10 8.6 C9.5 8 8.5 8.2 8.5 9 Z" fill="currentColor"/></svg>
            Confirm on WhatsApp
            </a>
          </div>
        </div>
      </section>

      <footer class="footer" id="footer">
        <span class="footer__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3 C8 7 8 13 12 21 C16 13 16 7 12 3 Z" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M12 6 L12 19" fill="none" stroke="currentColor" stroke-width="0.7"/></svg>
        </span>
        <p class="footer__couple" data-couple></p>
        <p class="footer__message" data-footer-message></p>
      </footer>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
